services:
  django-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: funderaise-django
    command: >
      sh -c "python manage.py migrate --noinput;
             daphne -b 0.0.0.0 -p 8000 funderaise.asgi:application"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - funderaise-net

  react-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: funderaise-react
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - .env
    depends_on:
      - django-api
    networks:
      - funderaise-net

  redis:
    image: redis:7-alpine
    container_name: funderaise-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - funderaise-net

volumes:
  redis-data:

networks:
  funderaise-net:
    driver: bridge
